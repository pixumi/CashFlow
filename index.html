<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowMaster - Cash Flow & Debts</title>
    
    <!-- Memuat Tailwind CSS untuk desain dan styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat React & ReactDOM dari CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Memuat Babel untuk menerjemahkan kode JSX di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Kustomisasi scrollbar agar rapi */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-teal-200">
    
    <!-- Elemen pembungkus utama aplikasi React -->
    <div id="root"></div>

    <!-- Script aplikasi dengan tipe text/babel -->
    <script type="text/babel">
        // --- KONFIGURASI DATABASE API CLOUDFLARE D1 ---
        // Masukkan URL Worker Anda di dalam tanda kutip di bawah ini.
        const API_URL = "https://api-cashflow.team-id.workers.dev/";
        const BASE_URL = API_URL ? API_URL.trim().replace(/\/$/, "") : "";

        const { useState, useEffect, useMemo } = React;

        // --- ICON COMPONENTS (Inline SVGs) ---
        const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>;
        const IconTrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const IconTrendingDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>;
        const IconBox = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;
        const IconMapPin = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const IconSearch = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const IconCamera = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
        const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const IconFileText = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;

        // --- HELPER COMPONENTS ---
        const PhotoGallery = ({ photos, title="Galeri Foto" }) => {
            if (!photos || photos.length === 0) return null;
            return (
                <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-3">{title}</h3>
                    <div className="flex gap-3 overflow-x-auto pb-2 snap-x">
                        {photos.map((p, i) => (
                            <a key={i} href={p} target="_blank" rel="noreferrer">
                                <img src={p} alt={`Foto ${i+1}`} className="w-32 h-32 object-cover rounded-2xl snap-center flex-shrink-0 border border-slate-100 shadow-sm hover:opacity-80 transition-opacity" />
                            </a>
                        ))}
                    </div>
                </div>
            );
        };

        const handlePhotoUpload = (e, setter, currentPhotos) => {
            const files = Array.from(e.target.files);
            Promise.all(files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
            })).then(base64Files => {
                setter([...(currentPhotos || []), ...base64Files]);
            });
        };

        // --- CHART COMPONENTS ---
        const SimpleLineChart = ({ data, color = "#0d9488" }) => {
          if (!data || data.length === 0) return <div className="text-slate-400 text-sm italic">Belum ada data</div>;
          const values = data.map(d => d.value ?? d);
          const labels = data.map(d => d.label ?? '');
          if (values.length === 1) { values.push(values[0]); labels.push(labels[0]); }
          
          const max = Math.max(...values);
          const min = Math.min(...values);
          const range = max - min || 1; 

          const points = values.map((val, i) => {
            const x = (i / (values.length - 1)) * 100;
            const y = 100 - ((val - min) / range) * 80 - 10; 
            return `${x},${y}`;
          }).join(' ');

          const formatY = (num) => new Intl.NumberFormat('id-ID', { notation: "compact", compactDisplay: "short" }).format(num);

          return (
            <div className="relative w-full h-32 mt-4 flex flex-col">
              <div className="flex-1 relative">
                  <div className="absolute left-0 top-0 text-[10px] text-slate-400 font-medium">Rp{formatY(max)}</div>
                  <div className="absolute left-0 bottom-0 text-[10px] text-slate-400 font-medium">Rp{formatY(min)}</div>
                  <div className="absolute left-12 right-2 top-2 bottom-2">
                    <svg viewBox="0 0 100 100" className="w-full h-full overflow-visible" preserveAspectRatio="none">
                      {[10, 30, 50, 70, 90].map(y => (
                        <line key={y} x1="0" y1={y} x2="100" y2={y} stroke="#f1f5f9" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                      ))}
                      <polyline fill="none" stroke={color} strokeWidth="2" vectorEffect="non-scaling-stroke" points={points} strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
              </div>
              <div className="flex justify-between mt-2 pl-12 pr-2 text-[10px] text-slate-400">
                 <span>{labels[0]}</span>
                 <span>{labels[labels.length - 1]}</span>
              </div>
            </div>
          );
        };

        const SimpleBarChart = ({ data, color = "#0d9488", unit = "" }) => {
          if (!data || data.length === 0) return <div className="text-slate-400 text-sm italic">Belum ada data</div>;
          const values = data.map(d => d.value ?? d);
          const max = Math.max(...values) || 1;

          return (
            <div className="flex items-end justify-between w-full h-32 mt-4 gap-2">
              {data.map((item, i) => {
                const val = item.value ?? item;
                const label = item.label ?? '';
                return (
                  <div key={i} className="flex-1 flex flex-col items-center justify-end h-full relative">
                    <div className="text-[10px] font-bold text-slate-700 mb-1 whitespace-nowrap">{val} {unit}</div>
                    <div 
                      style={{ height: `${(val / max) * 75}%`, minHeight: '4px', backgroundColor: color }} 
                      className="w-full rounded-t-sm transition-all duration-300"
                    ></div>
                    <div className="text-[9px] text-slate-400 mt-1 whitespace-nowrap overflow-hidden text-ellipsis w-full text-center" title={label}>
                      {label}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        };

        const ExpensePieChart = ({ transactions, materials, formatIDR }) => {
           const [tooltip, setTooltip] = useState(null);
           const expenses = transactions.filter(t => t.type === 'out');
           if(expenses.length === 0) return (
               <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 text-center text-slate-500 text-sm">
                   Belum ada pengeluaran pada periode ini
               </div>
           );

           const catTotals = {};
           expenses.forEach(tx => {
               const mat = materials.find(m => m.id === tx.materialId);
               const cat = mat ? mat.category : (tx.desc && tx.desc.includes('Piutang') ? 'Piutang' : (tx.desc && tx.desc.includes('Utang') ? 'Utang' : 'Lainnya'));
               catTotals[cat] = (catTotals[cat] || 0) + (tx.price || tx.amount || 0);
           });

           const colors = {
               'Motor': '#38bdf8', 'Bensin': '#2dd4bf', 'Hobby': '#fbbf24', 
               'Internet': '#a78bfa', 'Jajan': '#f472b6', 'Handphone': '#94a3b8', 
               'Piutang': '#6366f1', 'Utang': '#f43f5e', 'Lainnya': '#cbd5e1'
           };

           const total = Object.values(catTotals).reduce((a,b) => a+b, 0);
           let cumulativeAngle = 0;
           const entries = Object.entries(catTotals);
           const slices = [];

           if (entries.length === 1) {
               slices.push({
                   cat: entries[0][0], val: entries[0][1], percent: 1,
                   pathData: `M 50, 50 m -50, 0 a 50,50 0 1,0 100,0 a 50,50 0 1,0 -100,0`,
                   color: colors[entries[0][0]] || colors['Lainnya']
               });
           } else {
               entries.forEach(([cat, val]) => {
                   const percent = val / total;
                   const startX = 50 + 50 * Math.cos(cumulativeAngle * Math.PI / 180 - Math.PI / 2);
                   const startY = 50 + 50 * Math.sin(cumulativeAngle * Math.PI / 180 - Math.PI / 2);
                   cumulativeAngle += (percent * 360);
                   const endX = 50 + 50 * Math.cos(cumulativeAngle * Math.PI / 180 - Math.PI / 2);
                   const endY = 50 + 50 * Math.sin(cumulativeAngle * Math.PI / 180 - Math.PI / 2);
                   const largeArcFlag = percent > 0.5 ? 1 : 0;
                   const pathData = `M 50 50 L ${startX} ${startY} A 50 50 0 ${largeArcFlag} 1 ${endX} ${endY} Z`;
                   slices.push({ cat, val, percent, pathData, color: colors[cat] || colors['Lainnya'] });
               });
           }

           return (
               <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                   <div className="flex flex-col sm:flex-row items-center gap-6">
                     <div className="w-32 h-32 flex-shrink-0 relative" onMouseLeave={() => setTooltip(null)}>
                        <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-sm">
                            {slices.map((slice) => (
                                <path 
                                    key={slice.cat} d={slice.pathData} fill={slice.color} stroke="#ffffff" strokeWidth="3" strokeLinejoin="round"
                                    className="transition-all duration-300 hover:opacity-80 cursor-pointer outline-none"
                                    onMouseEnter={() => setTooltip({ cat: slice.cat, percent: Math.round(slice.percent * 100), val: slice.val })}
                                    onClick={() => setTooltip({ cat: slice.cat, percent: Math.round(slice.percent * 100), val: slice.val })}
                                />
                            ))}
                        </svg>
                        {tooltip && (
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-800/90 backdrop-blur-sm text-white text-[10px] py-1.5 px-2 rounded-xl shadow-lg pointer-events-none z-10 flex flex-col items-center w-max min-w-[70px] text-center border border-slate-600 animate-in fade-in zoom-in-95 duration-200">
                                <span className="font-bold">{tooltip.cat}</span>
                                <span className="text-slate-200">{tooltip.percent}%</span>
                            </div>
                        )}
                     </div>
                     <div className="flex-1 grid grid-cols-2 gap-y-3 gap-x-2 w-full">
                         {Object.entries(catTotals).map(([cat, val]) => (
                             <div key={cat} className="flex flex-col text-sm">
                                 <div className="flex items-center gap-2 mb-0.5">
                                   <div className="w-3 h-3 rounded-full" style={{ backgroundColor: colors[cat] || colors['Lainnya'] }}></div>
                                   <span className="text-slate-600 text-xs font-medium">{cat}</span>
                                   <span className="font-bold text-slate-800 text-xs ml-auto">{Math.round((val/total)*100)}%</span>
                                 </div>
                                 <span className="text-slate-400 text-[10px] pl-5">{formatIDR(val)}</span>
                             </div>
                         ))}
                     </div>
                   </div>
               </div>
           )
        };

        // --- MAIN APP COMPONENT ---
        function CashFlowApp() {
          // --- STATES ---
          const [materials, setMaterials] = useState([]);
          const [places, setPlaces] = useState([]);
          const [transactions, setTransactions] = useState([]);
          const [debts, setDebts] = useState([]);

          // --- FETCH DATA ---
          useEffect(() => {
             if (!BASE_URL) return;
             
             // Fungsi aman untuk mengatasi error JSON jika Cloudflare merespon dengan text error
             const fetchSafe = async (endpoint) => {
                 try {
                     const res = await fetch(`${BASE_URL}/${endpoint}`);
                     const text = await res.text();
                     try {
                         return JSON.parse(text);
                     } catch (e) {
                         console.error(`Gagal parsing JSON dari /${endpoint}:`, text);
                         return null;
                     }
                 } catch (err) {
                     console.error(`Gagal Fetch dari /${endpoint}:`, err);
                     return null;
                 }
             };

             Promise.all([
                 fetchSafe('materials'),
                 fetchSafe('places'),
                 fetchSafe('transactions'),
                 fetchSafe('debts')
             ]).then(([m, p, t, d]) => {
                 // Memastikan string JSON dari database D1 diubah kembali menjadi Array JavaScript
                 if (m?.success) setMaterials(m.data.map(x => ({...x, photos: x.photos ? JSON.parse(x.photos) : []})));
                 if (p?.success) setPlaces(p.data.map(x => ({...x, photos: x.photos ? JSON.parse(x.photos) : []})));
                 if (t?.success) setTransactions(t.data);
                 if (d?.success) setDebts(d.data.map(x => ({
                     ...x, 
                     agreementPhotos: x.agreementPhotos ? JSON.parse(x.agreementPhotos) : [], 
                     settlementPhotos: x.settlementPhotos ? JSON.parse(x.settlementPhotos) : []
                 })));
             });
          }, []);

          // Navigation State
          const [currentView, setCurrentView] = useState('dashboard');
          const [viewParams, setViewParams] = useState({});

          // --- UTILS & HELPERS ---
          const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
          const formatDate = (dateStr) => new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(dateStr));
          
          const navigate = (view, params = {}) => {
            setCurrentView(view);
            setViewParams(params);
          };

          const getPrefix = (category) => {
            const map = { 'Motor': 'MTR', 'Bensin': 'BSN', 'Hobby': 'HBB', 'Internet': 'INT', 'Jajan': 'JJN', 'Handphone': 'HPN' };
            return map[category] || 'MAT';
          };

          const generateMaterialId = (category) => {
            const prefix = getPrefix(category);
            const existing = materials.filter(m => m.id.startsWith(prefix));
            return `${prefix}-${String(existing.length + 1).padStart(3, '0')}`;
          };

          const generatePlaceId = () => `PLC-${String(places.length + 1).padStart(3, '0')}`;
          const generateTxId = () => `TX-${Date.now().toString().slice(-6)}`;
          const generateDebtId = () => `DBT-${Date.now().toString().slice(-6)}`;

          const parseTxDate = (dateStr) => {
            const [year, month, day] = dateStr.split('-');
            return new Date(year, month - 1, day);
          };

          const getFilteredTransactions = (txs, period) => {
            if (period === 'all') return txs;
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();
            const d = now.getDate();
            
            const today = new Date(y, m, d);
            const dayOfWeek = today.getDay();
            const diffToMonday = d - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            const startOfWeek = new Date(y, m, diffToMonday);
            
            return txs.filter(tx => {
              const txDate = parseTxDate(tx.date);
              if (period === 'today') return txDate.getTime() === today.getTime();
              if (period === 'week') return txDate >= startOfWeek;
              if (period === 'month') return txDate.getFullYear() === y && txDate.getMonth() === m;
              if (period === 'year') return txDate.getFullYear() === y;
              return true; 
            });
          };

          const renderTxItem = (tx) => {
            const isOut = tx.type === 'out';
            const mat = materials.find(m => m.id === tx.materialId);
            return (
              <div key={tx.id} className="p-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                <div className="flex items-center gap-3">
                  <div className={`p-3 rounded-2xl flex-shrink-0 ${isOut ? 'bg-rose-50 text-rose-500' : 'bg-teal-50 text-teal-500'}`}>
                    {isOut ? <IconBox /> : <IconWallet />}
                  </div>
                  <div className="overflow-hidden">
                    <p className="font-semibold text-slate-800 text-sm whitespace-nowrap text-ellipsis overflow-hidden">
                      {mat ? (
                         <button onClick={() => navigate('material_detail', { id: mat.id })} className="hover:text-teal-600 hover:underline text-left cursor-pointer transition-colors">
                            {mat.desc}
                         </button>
                      ) : (tx.desc || 'Transaksi')}
                    </p>
                    <p className="text-xs text-slate-400 mt-0.5">{formatDate(tx.date)} {isOut && mat ? `• ${mat.category}` : ''}</p>
                  </div>
                </div>
                <div className={`font-semibold whitespace-nowrap flex-shrink-0 ml-2 ${isOut ? 'text-rose-600' : 'text-teal-600'}`}>
                  {isOut ? '-' : '+'}{formatIDR(isOut ? (tx.price || tx.amount) : tx.amount)}
                </div>
              </div>
            );
          };

          // --- DERIVED DATA ---
          const totalIn = transactions.filter(t => t.type === 'in').reduce((acc, curr) => acc + curr.amount, 0);
          const totalOut = transactions.filter(t => t.type === 'out').reduce((acc, curr) => acc + (curr.price || curr.amount || 0), 0);
          const balance = totalIn - totalOut;
          
          const activeUtangList = debts.filter(d => d.type === 'utang' && d.status === 'active');
          const activePiutangList = debts.filter(d => d.type === 'piutang' && d.status === 'active');
          const totalActiveUtang = activeUtangList.reduce((acc, curr) => acc + curr.amount, 0);
          const totalActivePiutang = activePiutangList.reduce((acc, curr) => acc + curr.amount, 0);

          // --- SUB-COMPONENTS (PAGES) ---

          // 1. Dashboard
          const Dashboard = () => {
            const [periodFilter, setPeriodFilter] = useState('all');
            const [txTypeFilter, setTxTypeFilter] = useState('all');

            const periodFilteredTxs = getFilteredTransactions(transactions, periodFilter);
            let listTxs = periodFilteredTxs.filter(tx => txTypeFilter === 'all' || tx.type === txTypeFilter);
            listTxs.sort((a, b) => new Date(b.date) - new Date(a.date));

            return (
              <div className="space-y-6 pb-20 sm:pb-6 fade-in">
                <div className="bg-gradient-to-br from-teal-500 to-emerald-600 rounded-3xl p-6 text-white shadow-lg shadow-teal-200">
                  <p className="text-teal-50 text-sm font-medium mb-1">Total Saldo Saat Ini</p>
                  <h2 className="text-3xl sm:text-4xl font-bold tracking-tight mb-6">{formatIDR(balance)}</h2>
                  <div className="grid grid-cols-2 gap-4">
                    <button onClick={() => navigate('transaction_list', { type: 'out' })} className="bg-white/20 backdrop-blur-md rounded-2xl p-4 text-left cursor-pointer hover:bg-white/30 transition-all shadow-sm">
                      <div className="flex items-center gap-2 mb-1">
                        <div className="p-1 bg-white/20 rounded-full"><IconTrendingDown /></div>
                        <span className="text-xs font-medium uppercase tracking-wider">Pengeluaran</span>
                      </div>
                      <p className="font-semibold">{formatIDR(totalOut)}</p>
                    </button>
                    <button onClick={() => navigate('transaction_list', { type: 'in' })} className="bg-white/20 backdrop-blur-md rounded-2xl p-4 text-left cursor-pointer hover:bg-white/30 transition-all shadow-sm">
                      <div className="flex items-center gap-2 mb-1">
                        <div className="p-1 bg-white/20 rounded-full"><IconTrendingUp /></div>
                        <span className="text-xs font-medium uppercase tracking-wider">Pemasukan</span>
                      </div>
                      <p className="font-semibold">{formatIDR(totalIn)}</p>
                    </button>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button onClick={() => navigate('add_expense')} className="flex-1 bg-white border border-rose-100 hover:bg-rose-50 text-rose-600 font-semibold py-3 px-2 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-1 transition-colors text-sm">
                    <IconTrendingDown /> Catat Keluar
                  </button>

            const [showPlaceDropdown, setShowPlaceDropdown] = useState(false);
            
            const totalPrice = (parseFloat(qty) || 0) * (parseInt(pricePerUnit) || 0);

            useEffect(() => {
              if (viewParams.prefilledMaterial) {
                const m = materials.find(x => x.id === viewParams.prefilledMaterial);
                if (m) selectMaterial(m);
              }
              if (viewParams.prefilledPlace) {

            const selectMaterial = (m) => {
              setMaterialId(m.id);
              setMatSearch(m.id);
              setDescSearch(`${m.desc} - ${m.partNum}`);
              setShowMatDropdown(false);
              setShowDescDropdown(false);

            const selectPlace = (p) => {
              setPlaceId(p.id);
              setPlaceSearch(p.name);
              setShowPlaceDropdown(false);

            const handleBlur = (setter) => {
              setTimeout(() => setter(false), 200);
            };

            const handleSave = (e) => {
              e.preventDefault();
              if (!materialId || !totalPrice || !placeId) return;
              const newTx = {
                id: generateTxId(), type: 'out', date, materialId, qty: parseFloat(qty),
                pricePerUnit: parseInt(pricePerUnit), price: totalPrice, placeId
              };
              setTransactions([...transactions, newTx]);
              if (BASE_URL) fetch(`${BASE_URL}/transactions`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(newTx) }).catch(console.error);
              navigate('dashboard');

            const outMaterials = materials.filter(m => m.flowType === 'out' || m.flowType === undefined);
            const filteredByMat = outMaterials.filter(m => m.id.toLowerCase().includes(matSearch.toLowerCase()));
            const filteredByDesc = outMaterials.filter(m => {
              const searchStr = descSearch.toLowerCase();
              const combined = `${m.desc} - ${m.partNum || ''}`.toLowerCase();
              return combined.includes(searchStr);
            });
            const filteredPlaces = places.filter(p => p.name.toLowerCase().includes(placeSearch.toLowerCase()));

            return (

                  <button onClick={() => navigate('dashboard')} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>
                  <h2 className="text-xl font-bold text-slate-800">Catat Pengeluaran</h2>
                </div>

                <form onSubmit={handleSave} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-5">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-slate-50" />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                       <label className="block text-sm font-medium text-slate-700">Pilih Material / Barang</label>

                    <div className="space-y-3 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                      <div className="relative">
                        <input type="text" value={matSearch} 
                           onChange={e => { setMatSearch(e.target.value); setMaterialId(''); setShowMatDropdown(true); }}
                           onFocus={() => setShowMatDropdown(true)} onBlur={() => handleBlur(setShowMatDropdown)}

                           placeholder="Ketik ID Material Master..." required={!materialId} />
                        {showMatDropdown && (
                          <div className="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto">
                            {filteredByMat.length > 0 ? filteredByMat.map(m => (
                              <div key={m.id} onClick={() => selectMaterial(m)} className="px-4 py-2 hover:bg-teal-50 cursor-pointer text-sm border-b border-slate-50"><span className="font-bold text-teal-700">{m.id}</span></div>
                            )) : <div className="px-4 py-2 text-sm text-slate-400">Tidak ditemukan</div>}
                          </div>
                        )}
                      </div>
                      <div className="relative">
                        <input type="text" value={descSearch} 
                           onChange={e => { setDescSearch(e.target.value); setMaterialId(''); setShowDescDropdown(true); }}
                           onFocus={() => setShowDescDropdown(true)} onBlur={() => handleBlur(setShowDescDropdown)}
                           className="w-full border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-white text-sm"
                           placeholder="Atau ketik Nama Barang - Part Number..." required={!materialId} />
                        {showDescDropdown && (
                          <div className="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto">
                            {filteredByDesc.length > 0 ? filteredByDesc.map(m => (
                              <div key={m.id} onClick={() => selectMaterial(m)} className="px-4 py-2 hover:bg-teal-50 cursor-pointer text-sm border-b border-slate-50">{m.desc} - {m.partNum} <span className="text-xs text-slate-400">({m.id})</span></div>
                            )) : <div className="px-4 py-2 text-sm text-slate-400">Tidak ditemukan</div>}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                     <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Qty</label>
                        <input type="number" step="any" min="0.01" value={qty} onChange={e => setQty(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-slate-50" placeholder="1" />
                     </div>
                     <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Harga Satuan</label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500 font-medium">Rp</div>
                          <input type="number" value={pricePerUnit} onChange={e => setPricePerUnit(e.target.value)} required className="w-full border border-slate-200 rounded-xl pl-10 pr-3 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-slate-50" placeholder="0" />
                        </div>
                     </div>
                  </div>

                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center">
                     <span className="text-sm font-medium text-slate-500">Total Harga:</span>

                  </div>

                    <div className="flex justify-between items-center mb-1">

                    </div>
                    <div className="relative">
                      <input type="text" value={placeSearch}

          // 6. Add/Edit Material Master
          const AddMaterial = () => {
            const isEdit = !!viewParams.editId;
            const existing = isEdit ? materials.find(m => m.id === viewParams.editId) : null;
            const [flowType, setFlowType] = useState(existing?.flowType || 'out');
            const [desc, setDesc] = useState(existing?.desc || '');
            const [partNum, setPartNum] = useState(existing?.partNum || '');
            const [brand, setBrand] = useState(existing?.brand || '');
            const [unit, setUnit] = useState(existing?.unit || 'Pcs');
            const [category, setCategory] = useState(existing?.category || 'Motor');
            const [amount, setAmount] = useState(existing?.amount || '');
            const [source, setSource] = useState(existing?.source || '');
            const [photos, setPhotos] = useState(existing?.photos || []);

            const handleSave = (e) => {
              e.preventDefault();
              const matData = {
                flowType, desc, 
                partNum: flowType === 'out' ? partNum : '', 
                brand: flowType === 'out' ? brand : '', 
                unit: flowType === 'out' ? unit : '', 
                category: flowType === 'out' ? category : 'Income',
                amount: flowType === 'in' ? parseInt(amount) : undefined,
                source: flowType === 'in' ? source : undefined,
                photos: flowType === 'out' ? JSON.stringify(photos) : "[]"
              };

              if (isEdit) {
                setMaterials(materials.map(m => m.id === existing.id ? { ...m, ...matData, photos } : m));
                if (BASE_URL) fetch(`${BASE_URL}/materials`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id: existing.id, ...matData}) }).catch(console.error);
                navigate('material_detail', { id: existing.id });
              } else {
                const newId = generateMaterialId(flowType === 'in' ? 'Income' : category);
                const newMat = { id: newId, ...matData, photos };
                setMaterials([...materials, newMat]);
                if (BASE_URL) fetch(`${BASE_URL}/materials`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({...newMat, photos: matData.photos}) }).catch(console.error);
                navigate(viewParams.returnTo || 'materials', { prefilledMaterial: newId });
              }
            };
            const categories = ["Motor", "Bensin", "Hobby", "Internet", "Jajan", "Handphone"];
            return (
              <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">
                 <div className="flex items-center gap-3">
                  <button onClick={() => navigate(isEdit ? 'material_detail' : (viewParams.returnTo || 'materials'), { id: isEdit ? existing.id : undefined })} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>
                  <h2 className="text-xl font-bold text-slate-800">{isEdit ? 'Edit Material Master' : 'Buat Material Master'}</h2>
                </div>
                <form onSubmit={handleSave} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                   {!isEdit && (
                     <div className="flex gap-2 p-1 bg-slate-100 rounded-xl mb-4">
                       <button type="button" onClick={() => setFlowType('out')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${flowType === 'out' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`}>Pengeluaran</button>
                       <button type="button" onClick={() => setFlowType('in')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${flowType === 'in' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`}>Pemasukan</button>
                     </div>
                   )}
                   <div className="bg-slate-50 p-4 rounded-2xl mb-2 flex items-center justify-between border border-slate-100">
                     <span className="text-sm font-medium text-slate-500">Kode ID:</span>
                     <span className={`font-bold ${flowType === 'in' ? 'text-emerald-700' : 'text-teal-700'}`}>{isEdit ? existing.id : generateMaterialId(flowType === 'in' ? 'Income' : category)}</span>
                   </div>
                  {flowType === 'out' ? (
                    <>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                        <select value={category} onChange={e => setCategory(e.target.value)} disabled={isEdit} className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-slate-50 disabled:opacity-70">
                          {categories.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Deskripsi Barang</label>
                        <input type="text" value={desc} onChange={e => setDesc(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-slate-50" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Part Number</label>
                          <input type="text" value={partNum} onChange={e => setPartNum(e.target.value)} className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-slate-50" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Brand</label>
                          <input type="text" value={brand} onChange={e => setBrand(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-slate-50" />
                        </div>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Satuan</label>
                        <input type="text" value={unit} onChange={e => setUnit(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 bg-slate-50" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-2">Galeri Foto Barang</label>
                        <div className="flex flex-wrap gap-3">
                           {photos.map((p, i) => (
                              <div key={i} className="relative w-20 h-20 rounded-xl border border-slate-200 overflow-hidden group">
                                 <img src={p} alt="Preview" className="w-full h-full object-cover" />
                                 <button type="button" onClick={() => setPhotos(photos.filter((_, idx) => idx !== i))} className="absolute top-1 right-1 p-1 bg-white/90 text-rose-500 rounded-md opacity-0 group-hover:opacity-100 transition-opacity"><IconX /></button>
                              </div>

                           <label className="w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 hover:text-teal-600 hover:border-teal-500 hover:bg-teal-50 transition-all cursor-pointer">
                              <IconCamera /><span className="text-[10px] font-medium mt-1">Upload</span>
                              <input type="file" multiple accept="image/*" className="hidden" onChange={e => handlePhotoUpload(e, setPhotos, photos)} />
                           </label>
                        </div>
                      </div>
                    </>

                       <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Nama Pemasukan</label>
                        <input type="text" value={desc} onChange={e => setDesc(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 bg-slate-50" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Sumber Income</label>
                        <input type="text" value={source} onChange={e => setSource(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 bg-slate-50" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Jumlah Default (Opsional)</label>
                        <div className="relative">
                          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500 font-medium">Rp</div>
                          <input type="number" value={amount} onChange={e => setAmount(e.target.value)} className="w-full border border-slate-200 rounded-xl pl-10 pr-3 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 bg-slate-50" />
                        </div>
                      </div>
                    </>
                  )}
                  <button type="submit" className={`w-full text-white font-bold py-4 rounded-xl shadow-lg mt-4 ${flowType === 'in' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-teal-600 hover:bg-teal-700'}`}>Simpan Material</button>
                </form>
              </div>
            )
          };

           // 7. Add/Edit Place Form

            const isEdit = !!viewParams.editId;
            const existing = isEdit ? places.find(p => p.id === viewParams.editId) : null;
            const [name, setName] = useState(existing?.name || '');
            const [address, setAddress] = useState(existing?.address || '');
            const [mapLink, setMapLink] = useState(existing?.mapLink || '');
            const [photos, setPhotos] = useState(existing?.photos || []);

            const handleSave = (e) => {
              e.preventDefault();
              if (isEdit) {
                 setPlaces(places.map(p => p.id === existing.id ? { ...p, name, address, mapLink, photos } : p));
                 if (BASE_URL) fetch(`${BASE_URL}/places`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id: existing.id, name, address, mapLink, photos: JSON.stringify(photos)}) }).catch(console.error);
                 navigate('place_detail', { id: existing.id });
              } else {
                 const newId = generatePlaceId();
                 const newPlace = { id: newId, name, address, mapLink, photos };
                 setPlaces([...places, newPlace]);
                 if (BASE_URL) fetch(`${BASE_URL}/places`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({...newPlace, photos: JSON.stringify(photos)}) }).catch(console.error);
                 navigate(viewParams.returnTo || 'places', { prefilledPlace: newId });
              }
            };
            return (
              <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">
                 <div className="flex items-center gap-3">
                  <button onClick={() => navigate(isEdit ? 'place_detail' : (viewParams.returnTo || 'places'), { id: isEdit ? existing.id : undefined })} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>
                  <h2 className="text-xl font-bold text-slate-800">{isEdit ? 'Edit Toko / Vendor' : 'Tambah Tempat'}</h2>
                </div>
                <form onSubmit={handleSave} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Nama Tempat</label>
                    <input type="text" value={name} onChange={e => setName(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Alamat Lengkap</label>
                    <textarea value={address} onChange={e => setAddress(e.target.value)} rows="3" className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50"></textarea>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Link Google Maps</label>
                    <input type="url" value={mapLink} onChange={e => setMapLink(e.target.value)} className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-2">Galeri Foto Toko</label>

                              <button type="button" onClick={() => setPhotos(photos.filter((_, idx) => idx !== i))} className="absolute top-1 right-1 p-1 bg-white/90 text-rose-500 rounded-md opacity-0 group-hover:opacity-100"><IconX /></button>
                          </div>
                        ))}
                        <label className="w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 hover:text-indigo-600 hover:border-indigo-500 cursor-pointer">
                          <IconCamera /><span className="text-[10px] font-medium mt-1">Upload</span>
                          <input type="file" multiple accept="image/*" className="hidden" onChange={e => handlePhotoUpload(e, setPhotos, photos)} />
                        </label>
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg mt-4">Simpan Tempat</button>
                </form>
              </div>
            )
           };

           // 8. Add Income Form
           const AddIncome = () => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [materialId, setMaterialId] = useState('');
            const [matSearch, setMatSearch] = useState('');
            const [descSearch, setDescSearch] = useState('');
            const [showMatDropdown, setShowMatDropdown] = useState(false);
            const [showDescDropdown, setShowDescDropdown] = useState(false);
            const [amount, setAmount] = useState('');

            const selectMaterial = (m) => {
              setMaterialId(m.id); setMatSearch(m.id); setDescSearch(`${m.desc} - ${m.source}`);
              if (m.amount) setAmount(m.amount);
              setShowMatDropdown(false); setShowDescDropdown(false);
            };
            const handleBlur = (setter) => setTimeout(() => setter(false), 200);

              e.preventDefault();
              if (!materialId || !amount) return;
              const newTx = { id: generateTxId(), type: 'in', date, materialId, amount: parseInt(amount) };
              setTransactions([...transactions, newTx]);
              if (BASE_URL) fetch(`${BASE_URL}/transactions`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(newTx) }).catch(console.error);
              navigate('dashboard');

            const inMaterials = materials.filter(m => m.flowType === 'in' || m.category === 'Income');
            const filteredByMat = inMaterials.filter(m => m.id.toLowerCase().includes(matSearch.toLowerCase()));
            const filteredByDesc = inMaterials.filter(m => {
              const combined = `${m.desc} - ${m.source || ''}`.toLowerCase();
              return combined.includes(descSearch.toLowerCase());
            });

            return (
              <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">
                 <div className="flex items-center gap-3">
                  <button onClick={() => navigate('dashboard')} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>

                <form onSubmit={handleSave} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-5">

                    <label className="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50" />

                    <div className="flex justify-between items-center mb-1">
                       <label className="block text-sm font-medium text-slate-700">Pilih Master Pemasukan</label>
                       <button type="button" onClick={() => navigate('add_material', { returnTo: 'add_income' })} className="text-xs text-emerald-600 font-semibold hover:underline">+ Buat Baru</button>
                    </div>
                    <div className="space-y-3 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                      <div className="relative">
                        <input type="text" value={descSearch} 
                           onChange={e => { setDescSearch(e.target.value); setMaterialId(''); setShowDescDropdown(true); }}
                           onFocus={() => setShowDescDropdown(true)} onBlur={() => handleBlur(setShowDescDropdown)}
                           className="w-full border border-slate-200 rounded-xl px-4 py-2 bg-white text-sm"
                           placeholder="Cari Nama / Sumber Income..." required={!materialId} />
                        {showDescDropdown && (
                          <div className="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto">
                            {filteredByDesc.length > 0 ? filteredByDesc.map(m => (
                              <div key={m.id} onClick={() => selectMaterial(m)} className="px-4 py-2 hover:bg-emerald-50 cursor-pointer text-sm border-b border-slate-50">{m.desc} - {m.source}</div>
                            )) : <div className="px-4 py-2 text-sm text-slate-400">Tidak ditemukan</div>}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Jumlah Pemasukan</label>
                     <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><span className="text-slate-500 font-medium">Rp</span></div>
                      <input type="number" value={amount} onChange={e => setAmount(e.target.value)} required className="w-full border border-slate-200 rounded-xl pl-12 pr-4 py-3 bg-slate-50" placeholder="0" />
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg mt-4">Simpan Pemasukan</button>
                </form>
              </div>
            )
           };

           // --- DEBTS (UTANG & PIUTANG) COMPONENTS ---

           // 9. List Debts
           const DebtList = () => {
              const [tab, setTab] = useState('utang'); // 'utang' | 'piutang'
              const [statusFilter, setStatusFilter] = useState('active'); // 'active' | 'settled'

              const filteredDebts = debts.filter(d => d.type === tab && d.status === statusFilter);

              return (
                 <div className="space-y-4 pb-20 sm:pb-6 fade-in">
                    <div className="flex items-center justify-between">
                       <h2 className="text-2xl font-bold text-slate-800">Utang & Piutang</h2>
                       <button onClick={() => navigate('add_debt')} className="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl shadow-sm transition-colors">
                          <IconPlus />
                       </button>
                    </div>

                    <div className="flex gap-2 p-1 bg-slate-100 rounded-xl">
                       <button onClick={() => setTab('utang')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${tab === 'utang' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`}>Utang (Saya Pinjam)</button>
                       <button onClick={() => setTab('piutang')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${tab === 'piutang' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`}>Piutang (Memberi Pinjaman)</button>
                    </div>

                    <div className="flex justify-between items-center px-1">
                       <h3 className="font-bold text-slate-600 text-sm">Status</h3>
                       <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="border border-slate-200 rounded-lg px-2 py-1 text-sm bg-white outline-none">
                          <option value="active">Belum Lunas (Aktif)</option>
                          <option value="settled">Sudah Lunas (Selesai)</option>
                       </select>
                    </div>

                    {filteredDebts.length === 0 ? (
                       <div className="bg-white p-6 rounded-3xl border border-slate-100 text-center text-slate-500 text-sm shadow-sm">
                          Belum ada catatan {tab} {statusFilter === 'active' ? 'yang belum lunas' : 'yang sudah lunas'}.
                       </div>
                    ) : (
                       <div className="grid gap-4">
                          {filteredDebts.map(d => (
                             <div key={d.id} onClick={() => navigate('debt_detail', { id: d.id })} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-all flex justify-between items-center">
                                <div>
                                   <div className="flex items-center gap-2 mb-1">
                                      <span className={`text-[10px] font-bold px-2 py-1 rounded-md uppercase ${d.status === 'active' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                         {d.status === 'active' ? 'Belum Lunas' : 'Lunas'}
                                      </span>
                                      <span className="text-[10px] text-slate-400 font-medium">Jatuh Tempo: {formatDate(d.dueDate)}</span>
                                   </div>
                                   <h3 className="font-bold text-slate-800 text-lg">{d.personName}</h3>
                                   <p className="text-xs text-slate-500">Tgl Pinjam: {formatDate(d.date)}</p>
                                </div>
                                <div className={`font-bold text-lg ${tab === 'utang' ? 'text-rose-600' : 'text-indigo-600'}`}>
                                   {formatIDR(d.amount)}
                                </div>
                             </div>
                          ))}
                       </div>
                    )}
                 </div>
              )
           }

           // 10. Add Debt Form
           const AddDebt = () => {
              const [type, setType] = useState('utang');
              const [personName, setPersonName] = useState('');
              const [amount, setAmount] = useState('');
              const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
              const [dueDate, setDueDate] = useState('');
              const [agreementPhotos, setAgreementPhotos] = useState([]);

              const handleSave = (e) => {
                 e.preventDefault();
                 if(!personName || !amount || !dueDate) return;

                 const newDebt = {
                    id: generateDebtId(), type, personName, amount: parseInt(amount), date, dueDate, status: 'active',
                    agreementPhotos: JSON.stringify(agreementPhotos), settlementPhotos: "[]"
                 };

                 // Buat Transaksi otomatis. Utang -> Pemasukan (Cash In). Piutang -> Pengeluaran (Cash Out)
                 const newTx = {
                    id: generateTxId(),
                    type: type === 'utang' ? 'in' : 'out',
                    date,
                    desc: type === 'utang' ? `Pencairan Utang dari ${personName}` : `Pemberian Piutang ke ${personName}`,
                 };
                 if (type === 'utang') { newTx.amount = parseInt(amount); } 
                 else { newTx.price = parseInt(amount); }

                 setDebts([...debts, { ...newDebt, agreementPhotos }]);
                 setTransactions([...transactions, newTx]);

                 if(BASE_URL) {
                    fetch(`${BASE_URL}/debts`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(newDebt) }).catch(console.error);
                    fetch(`${BASE_URL}/transactions`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(newTx) }).catch(console.error);
                 }
                 navigate('debts');
              }

              return (
                 <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">
                    <div className="flex items-center gap-3">
                       <button onClick={() => navigate('debts')} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>
                       <h2 className="text-xl font-bold text-slate-800">Catat {type === 'utang' ? 'Utang' : 'Piutang'} Baru</h2>
                    </div>

                    <form onSubmit={handleSave} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                       <div className="flex gap-2 p-1 bg-slate-100 rounded-xl mb-4">
                          <button type="button" onClick={() => setType('utang')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${type === 'utang' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`}>Utang</button>
                          <button type="button" onClick={() => setType('piutang')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${type === 'piutang' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`}>Piutang</button>
                       </div>

                       <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Nama Orang/Pihak</label>
                          <input type="text" value={personName} onChange={e => setPersonName(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50" placeholder={type === 'utang' ? 'Cth: Budi (Pemberi Pinjaman)' : 'Cth: Andi (Yang Meminjam)'} />
                       </div>
                       
                       <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Nominal (Rp)</label>
                          <input type="number" value={amount} onChange={e => setAmount(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50" placeholder="0" />
                       </div>

                       <div className="grid grid-cols-2 gap-4">
                          <div>
                             <label className="block text-sm font-medium text-slate-700 mb-1">Tgl Pinjam</label>
                             <input type="date" value={date} onChange={e => setDate(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50" />
                          </div>
                          <div>
                             <label className="block text-sm font-medium text-slate-700 mb-1">Estimasi Lunas</label>
                             <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50" />
                          </div>
                       </div>

                       <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">Foto Perjanjian / Bukti Transfer (Opsional)</label>
                          <div className="flex flex-wrap gap-3">
                             {agreementPhotos.map((p, i) => (
                                <div key={i} className="relative w-20 h-20 rounded-xl border border-slate-200 overflow-hidden group">
                                   <img src={p} alt="Preview" className="w-full h-full object-cover" />
                                   <button type="button" onClick={() => setAgreementPhotos(agreementPhotos.filter((_, idx) => idx !== i))} className="absolute top-1 right-1 p-1 bg-white/90 text-rose-500 rounded-md"><IconX /></button>
                                </div>
                             ))}
                             <label className="w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 hover:text-indigo-600 hover:border-indigo-500 cursor-pointer">
                                <IconCamera /><span className="text-[10px] font-medium mt-1">Upload</span>
                                <input type="file" multiple accept="image/*" className="hidden" onChange={e => handlePhotoUpload(e, setAgreementPhotos, agreementPhotos)} />
                             </label>
                          </div>
                       </div>

                       <button type="submit" className={`w-full text-white font-bold py-4 rounded-xl shadow-lg mt-4 ${type === 'utang' ? 'bg-rose-600 hover:bg-rose-700' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                          Simpan {type === 'utang' ? 'Utang' : 'Piutang'}
                       </button>
                    </form>
                 </div>
              )
           }

           // 11. Debt Detail & Settlement
           const DebtDetail = () => {
              const debt = debts.find(d => d.id === viewParams.id);
              if (!debt) return <div>Data tidak ditemukan</div>;

              const [isSettling, setIsSettling] = useState(false);
              const [settleDate, setSettleDate] = useState(new Date().toISOString().split('T')[0]);
              const [settlementPhotos, setSettlementPhotos] = useState([]);

              const handleSettle = (e) => {
                 e.preventDefault();
                 if(!confirm(`Yakin ingin melunasi ${debt.type} ini?`)) return;

                 const updatedDebt = { ...debt, status: 'settled', settlementPhotos };
                 
                 // Transaksi pelunasan. Utang lunas -> Pengeluaran. Piutang lunas -> Pemasukan.
                 const newTx = {
                    id: generateTxId(),
                    type: debt.type === 'utang' ? 'out' : 'in',
                    date: settleDate,
                    desc: debt.type === 'utang' ? `Pelunasan Utang ke ${debt.personName}` : `Penerimaan Pelunasan Piutang dari ${debt.personName}`,
                 };
                 if (debt.type === 'utang') { newTx.price = debt.amount; } 
                 else { newTx.amount = debt.amount; }

                 setDebts(debts.map(d => d.id === debt.id ? updatedDebt : d));
                 setTransactions([...transactions, newTx]);

                 if(BASE_URL) {
                    const apiDebt = { ...updatedDebt, agreementPhotos: JSON.stringify(updatedDebt.agreementPhotos), settlementPhotos: JSON.stringify(updatedDebt.settlementPhotos) };
                    fetch(`${BASE_URL}/debts`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(apiDebt) }).catch(console.error);
                    fetch(`${BASE_URL}/transactions`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(newTx) }).catch(console.error);
                 }
                 setIsSettling(false);
              }

              return (
                 <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">
                    <div className="flex items-center gap-3">
                       <button onClick={() => navigate('debts')} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>
                       <h2 className="text-xl font-bold text-slate-800">Detail {debt.type === 'utang' ? 'Utang' : 'Piutang'}</h2>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                       <div className="flex justify-between items-start mb-4">
                          <div>
                             <div className="flex gap-2 items-center mb-2">
                                <span className="text-[10px] font-bold px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 uppercase">{debt.id}</span>
                                <span className={`text-[10px] font-bold px-2 py-1 rounded-md uppercase ${debt.status === 'active' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                   {debt.status === 'active' ? 'Belum Lunas' : 'Sudah Lunas'}
                                </span>
                             </div>
                             <h2 className="text-2xl font-bold text-slate-800">{debt.personName}</h2>
                          </div>
                       </div>
                       
                       <div className="bg-slate-50 p-4 rounded-2xl mb-4 border border-slate-100 text-center">
                          <p className="text-xs text-slate-500 font-bold uppercase mb-1">Total {debt.type}</p>
                          <p className={`text-3xl font-bold ${debt.type === 'utang' ? 'text-rose-600' : 'text-indigo-600'}`}>{formatIDR(debt.amount)}</p>
                       </div>

                       <div className="grid grid-cols-2 gap-4 text-sm border-t border-slate-50 pt-4">
                          <div>
                             <span className="block text-xs text-slate-400 mb-0.5">Tanggal Dibuat</span>
                             <span className="font-semibold text-slate-700">{formatDate(debt.date)}</span>
                          </div>
                          <div>
                             <span className="block text-xs text-slate-400 mb-0.5">Estimasi Lunas</span>
                             <span className="font-semibold text-slate-700">{formatDate(debt.dueDate)}</span>
                          </div>
                       </div>
                    </div>

                    <PhotoGallery photos={debt.agreementPhotos} title="Foto Perjanjian / Bukti Awal" />
                    
                    {debt.status === 'settled' && (
                       <PhotoGallery photos={debt.settlementPhotos} title="Bukti Pelunasan" />
                    )}

                    {debt.status === 'active' && !isSettling && (
                       <button onClick={() => setIsSettling(true)} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg mt-4 transition-all">
                          Konfirmasi Pelunasan
                       </button>
                    )}

                    {isSettling && (
                       <form onSubmit={handleSettle} className="bg-emerald-50 border border-emerald-200 p-5 rounded-3xl space-y-4 fade-in">
                          <h3 className="font-bold text-emerald-800">Form Pelunasan</h3>
                          <div>
                             <label className="block text-sm font-medium text-emerald-900 mb-1">Tanggal Lunas</label>
                             <input type="date" value={settleDate} onChange={e => setSettleDate(e.target.value)} required className="w-full border border-emerald-200 rounded-xl px-4 py-3 bg-white" />
                          </div>
                          <div>
                             <label className="block text-sm font-medium text-emerald-900 mb-2">Upload Bukti Pelunasan (Opsional)</label>
                             <div className="flex flex-wrap gap-3">
                                {settlementPhotos.map((p, i) => (
                                   <div key={i} className="relative w-16 h-16 rounded-xl overflow-hidden">
                                      <img src={p} alt="Preview" className="w-full h-full object-cover" />
                                      <button type="button" onClick={() => setSettlementPhotos(settlementPhotos.filter((_, idx) => idx !== i))} className="absolute top-0 right-0 p-1 bg-white/90 text-rose-500 rounded-bl-md"><IconX /></button>
                                   </div>
                                ))}
                                <label className="w-16 h-16 rounded-xl border-2 border-dashed border-emerald-300 flex flex-col items-center justify-center text-emerald-600 hover:bg-emerald-100 cursor-pointer">
                                   <IconCamera />
                                   <input type="file" multiple accept="image/*" className="hidden" onChange={e => handlePhotoUpload(e, setSettlementPhotos, settlementPhotos)} />
                                </label>
                             </div>
                          </div>
                          <div className="flex gap-2">
                             <button type="button" onClick={() => setIsSettling(false)} className="flex-1 bg-white border border-slate-200 text-slate-600 font-bold py-3 rounded-xl">Batal</button>
                             <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md">Simpan Lunas</button>
                          </div>
                       </form>
                    )}
                 </div>
              )
           }


          // MAIN RENDER
          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-800">
              
              {/* Top Header / Desktop Sidebar substitute */}
              <header className="bg-white border-b border-slate-100 sticky top-0 z-30 shadow-sm hidden sm:block">
                <div className="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-2 text-teal-600 font-bold text-xl">
                    <IconWallet /> FlowMaster
                  </div>
                  <nav className="flex gap-6">
                    <button onClick={() => navigate('dashboard')} className={`font-medium transition-colors ${currentView === 'dashboard' ? 'text-teal-600' : 'text-slate-500 hover:text-slate-800'}`}>Dashboard</button>
                    <button onClick={() => navigate('materials')} className={`font-medium transition-colors ${['materials','material_detail'].includes(currentView) ? 'text-teal-600' : 'text-slate-500 hover:text-slate-800'}`}>Materials</button>
                    <button onClick={() => navigate('places')} className={`font-medium transition-colors ${['places','place_detail'].includes(currentView) ? 'text-teal-600' : 'text-slate-500 hover:text-slate-800'}`}>Vendors</button>
                    <button onClick={() => navigate('debts')} className={`font-medium transition-colors ${['debts','debt_detail','add_debt'].includes(currentView) ? 'text-teal-600' : 'text-slate-500 hover:text-slate-800'}`}>Utang/Piutang</button>
                  </nav>
                </div>
              </header>

              {/* Mobile Top Header */}
              <header className="bg-white border-b border-slate-100 sticky top-0 z-30 shadow-sm sm:hidden">
                <div className="px-4 h-14 flex items-center justify-center relative">
                  <div className="flex items-center gap-2 text-teal-600 font-bold text-lg">
                    <IconWallet /> FlowMaster
                  </div>
                </div>
              </header>

              {/* Main Content Area */}
              <main className="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10 min-h-[calc(100vh-140px)]">
                {currentView === 'dashboard' && <Dashboard />}
                {currentView === 'transaction_list' && <TransactionList />}
                {currentView === 'materials' && <MaterialList />}
                {currentView === 'material_detail' && <MaterialDetail />}
                {currentView === 'places' && <PlaceList />}
                {currentView === 'add_expense' && <AddExpense />}
                {currentView === 'add_income' && <AddIncome />}
                {currentView === 'add_material' && <AddMaterial />}
                {currentView === 'add_place' && <AddPlace />}
                {currentView === 'place_detail' && <PlaceDetail />}
                
                {/* Utang/Piutang Views */}
                {currentView === 'debts' && <DebtList />}
                {currentView === 'add_debt' && <AddDebt />}
                {currentView === 'debt_detail' && <DebtDetail />}
              </main>

              {/* Mobile Bottom Navigation */}
              <nav className="sm:hidden fixed bottom-0 w-full bg-white border-t border-slate-100 px-2 py-3 grid grid-cols-4 z-40 pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
                <button onClick={() => navigate('dashboard')} className={`flex flex-col items-center gap-1 ${currentView === 'dashboard' ? 'text-teal-600' : 'text-slate-400'}`}>
                   <IconWallet />
                   <span className="text-[10px] font-medium">Home</span>
                </button>
                <button onClick={() => navigate('materials')} className={`flex flex-col items-center gap-1 ${['materials', 'material_detail'].includes(currentView) ? 'text-teal-600' : 'text-slate-400'}`}>
                   <IconBox />
                   <span className="text-[10px] font-medium">Material</span>
                </button>
                <button onClick={() => navigate('places')} className={`flex flex-col items-center gap-1 ${['places', 'place_detail'].includes(currentView) ? 'text-teal-600' : 'text-slate-400'}`}>
                   <IconMapPin />
                   <span className="text-[10px] font-medium">Vendor</span>
                </button>
                <button onClick={() => navigate('debts')} className={`flex flex-col items-center gap-1 ${['debts', 'debt_detail', 'add_debt'].includes(currentView) ? 'text-teal-600' : 'text-slate-400'}`}>
                   <IconFileText />
                   <span className="text-[10px] font-medium">Utang</span>
                </button>
              </nav>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CashFlowApp />);
    </script>
</body>
</html>
