<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowMaster - Cash Flow Tracker</title>
    
    <!-- Memuat Tailwind CSS untuk desain dan styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat React & ReactDOM dari CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Memuat Babel untuk menerjemahkan kode JSX di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Kustomisasi scrollbar agar rapi */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-teal-200">
    
    <!-- Elemen pembungkus utama aplikasi React -->
    <div id="root"></div>

    <!-- Script aplikasi dengan tipe text/babel -->
    <script type="text/babel">
        // Mengambil fungsi bawaan React dari global window
        const { useState, useEffect, useMemo } = React;

        // --- ICON COMPONENTS (Inline SVGs) ---
        const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>;
        const IconTrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const IconTrendingDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>;
        const IconBox = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;
        const IconMapPin = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const IconSearch = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const IconCamera = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
        const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;

        // --- HELPER COMPONENTS (Charts & Others) ---
        const PhotoGallery = ({ photos }) => {
            if (!photos || photos.length === 0) return null;
            return (
                <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-3">Galeri Foto</h3>
                    <div className="flex gap-3 overflow-x-auto pb-2 snap-x">
                        {photos.map((p, i) => (
                            <img key={i} src={p} alt={`Foto ${i+1}`} className="w-32 h-32 object-cover rounded-2xl snap-center flex-shrink-0 border border-slate-100 shadow-sm" />
                        ))}
                    </div>
                </div>
            );
        };

        const handlePhotoUpload = (e, setter, currentPhotos) => {
            const files = Array.from(e.target.files);
            Promise.all(files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
            })).then(base64Files => {
                setter([...(currentPhotos || []), ...base64Files]);
            });
        };

        const SimpleLineChart = ({ data, color = "#0d9488" }) => {
          if (!data || data.length === 0) return <div className="text-slate-400 text-sm italic">Belum ada data transaksi</div>;
          const values = data.map(d => d.value ?? d);
          const labels = data.map(d => d.label ?? '');
          if (values.length === 1) { values.push(values[0]); labels.push(labels[0]); }
          
          const max = Math.max(...values);
          const min = Math.min(...values);
          const range = max - min || 1; 

          const points = values.map((val, i) => {
            const x = (i / (values.length - 1)) * 100;
            const y = 100 - ((val - min) / range) * 80 - 10; 
            return `${x},${y}`;
          }).join(' ');

          const formatY = (num) => new Intl.NumberFormat('id-ID', { notation: "compact", compactDisplay: "short" }).format(num);

          return (
            <div className="relative w-full h-32 mt-4 flex flex-col">
              <div className="flex-1 relative">
                  <div className="absolute left-0 top-0 text-[10px] text-slate-400 font-medium">Rp{formatY(max)}</div>
                  <div className="absolute left-0 bottom-0 text-[10px] text-slate-400 font-medium">Rp{formatY(min)}</div>
                  <div className="absolute left-12 right-2 top-2 bottom-2">
                    <svg viewBox="0 0 100 100" className="w-full h-full overflow-visible" preserveAspectRatio="none">
                      {[10, 30, 50, 70, 90].map(y => (
                        <line key={y} x1="0" y1={y} x2="100" y2={y} stroke="#f1f5f9" strokeWidth="1" vectorEffect="non-scaling-stroke" />
                      ))}
                      <polyline fill="none" stroke={color} strokeWidth="2" vectorEffect="non-scaling-stroke" points={points} strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
              </div>
              <div className="flex justify-between mt-2 pl-12 pr-2 text-[10px] text-slate-400">
                 <span>{labels[0]}</span>
                 <span>{labels[labels.length - 1]}</span>
              </div>
            </div>
          );
        };

        const SimpleBarChart = ({ data, color = "#0d9488", unit = "" }) => {
          if (!data || data.length === 0) return <div className="text-slate-400 text-sm italic">Belum ada data frekuensi</div>;
          const values = data.map(d => d.value ?? d);
          const max = Math.max(...values) || 1;

          return (
            <div className="flex items-end justify-between w-full h-32 mt-4 gap-2">
              {data.map((item, i) => {
                const val = item.value ?? item;
                const label = item.label ?? '';
                return (
                  <div key={i} className="flex-1 flex flex-col items-center justify-end h-full relative">
                    <div className="text-[10px] font-bold text-slate-700 mb-1 whitespace-nowrap">{val} {unit}</div>
                    <div 
                      style={{ height: `${(val / max) * 75}%`, minHeight: '4px', backgroundColor: color }} 
                      className="w-full rounded-t-sm transition-all duration-300"
                    ></div>
                    <div className="text-[9px] text-slate-400 mt-1 whitespace-nowrap overflow-hidden text-ellipsis w-full text-center" title={label}>
                      {label}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        };

        const ExpensePieChart = ({ transactions, materials, formatIDR }) => {
           const [tooltip, setTooltip] = useState(null);
           const expenses = transactions.filter(t => t.type === 'out');
           if(expenses.length === 0) return (
               <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 text-center text-slate-500 text-sm">
                   Belum ada pengeluaran pada periode ini
               </div>
           );

           const catTotals = {};
           expenses.forEach(tx => {
               const mat = materials.find(m => m.id === tx.materialId);
               const cat = mat ? mat.category : 'Lainnya';
               catTotals[cat] = (catTotals[cat] || 0) + tx.price;
           });

           const colors = {
               'Motor': '#38bdf8', 'Bensin': '#2dd4bf', 'Hobby': '#fbbf24', 
               'Internet': '#a78bfa', 'Jajan': '#f472b6', 'Handphone': '#94a3b8', 'Lainnya': '#cbd5e1'
           };

           const total = Object.values(catTotals).reduce((a,b) => a+b, 0);
           let cumulativeAngle = 0;
           const entries = Object.entries(catTotals);
           const slices = [];

           if (entries.length === 1) {
               slices.push({
                   cat: entries[0][0], val: entries[0][1], percent: 1,
                   pathData: `M 50, 50 m -50, 0 a 50,50 0 1,0 100,0 a 50,50 0 1,0 -100,0`,
                   color: colors[entries[0][0]] || colors['Lainnya']
               });
           } else {
               entries.forEach(([cat, val]) => {
                   const percent = val / total;
                   const startX = 50 + 50 * Math.cos(cumulativeAngle * Math.PI / 180 - Math.PI / 2);
                   const startY = 50 + 50 * Math.sin(cumulativeAngle * Math.PI / 180 - Math.PI / 2);
                   
                   cumulativeAngle += (percent * 360);
                   
                   const endX = 50 + 50 * Math.cos(cumulativeAngle * Math.PI / 180 - Math.PI / 2);
                   const endY = 50 + 50 * Math.sin(cumulativeAngle * Math.PI / 180 - Math.PI / 2);
                   
                   const largeArcFlag = percent > 0.5 ? 1 : 0;
                   const pathData = `M 50 50 L ${startX} ${startY} A 50 50 0 ${largeArcFlag} 1 ${endX} ${endY} Z`;

                   slices.push({ cat, val, percent, pathData, color: colors[cat] || colors['Lainnya'] });
               });
           }

           return (
               <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                   <div className="flex flex-col sm:flex-row items-center gap-6">
                     <div className="w-32 h-32 flex-shrink-0 relative" onMouseLeave={() => setTooltip(null)}>
                        <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-sm">
                            {slices.map((slice) => (
                                <path 
                                    key={slice.cat} 
                                    d={slice.pathData} 
                                    fill={slice.color} 
                                    stroke="#ffffff" 
                                    strokeWidth="3"
                                    strokeLinejoin="round"
                                    className="transition-all duration-300 hover:opacity-80 cursor-pointer outline-none"
                                    onMouseEnter={() => setTooltip({ cat: slice.cat, percent: Math.round(slice.percent * 100), val: slice.val })}
                                    onClick={() => setTooltip({ cat: slice.cat, percent: Math.round(slice.percent * 100), val: slice.val })}
                                />
                            ))}
                        </svg>
                        {tooltip && (
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-800/90 backdrop-blur-sm text-white text-[10px] py-1.5 px-2 rounded-xl shadow-lg pointer-events-none z-10 flex flex-col items-center w-max min-w-[70px] text-center border border-slate-600 animate-in fade-in zoom-in-95 duration-200">
                                <span className="font-bold">{tooltip.cat}</span>
                                <span className="text-slate-200">{tooltip.percent}%</span>
                            </div>
                        )}
                     </div>
                     <div className="flex-1 grid grid-cols-2 gap-y-3 gap-x-2 w-full">
                         {Object.entries(catTotals).map(([cat, val]) => (
                             <div key={cat} className="flex flex-col text-sm">
                                 <div className="flex items-center gap-2 mb-0.5">
                                   <div className="w-3 h-3 rounded-full" style={{ backgroundColor: colors[cat] || colors['Lainnya'] }}></div>
                                   <span className="text-slate-600 text-xs font-medium">{cat}</span>
                                   <span className="font-bold text-slate-800 text-xs ml-auto">{Math.round((val/total)*100)}%</span>
                                 </div>
                                 <span className="text-slate-400 text-[10px] pl-5">{formatIDR(val)}</span>
                             </div>
                         ))}
                     </div>
                   </div>
               </div>
           )
        };

        // --- MAIN APP COMPONENT ---
        function CashFlowApp() {
          // --- STATE MANAGEMENT ---
          // Initial Mock Data to populate the application
          const [materials, setMaterials] = useState([
            { id: 'MTR-001', desc: 'Oli Mesin Matic', partNum: '10W-40', brand: 'Yamalube', unit: 'Botol', category: 'Motor', photos: [], flowType: 'out' },
            { id: 'BSN-001', desc: 'Pertamax', partNum: '-', brand: 'Pertamina', unit: 'Liter', category: 'Bensin', photos: [], flowType: 'out' },
            { id: 'INT-001', desc: 'Paket Data 50GB', partNum: 'PKG-50', brand: 'Telkomsel', unit: 'Bulan', category: 'Internet', photos: [], flowType: 'out' }
          ]);

          const [places, setPlaces] = useState([
            { id: 'PLC-001', name: 'Bengkel Resmi Yamaha', address: 'Jl. Ahmad Yani No 45, Kota', mapLink: 'https://maps.google.com', photos: [] },
            { id: 'PLC-002', name: 'SPBU Pertamina 34', address: 'Jl. Merdeka No 1', mapLink: 'https://maps.google.com', photos: [] }
          ]);

          const [transactions, setTransactions] = useState([
            { id: 'TX-001', type: 'in', date: '2026-11-01', desc: 'Gaji Bulanan', amount: 8000000 },
            { id: 'TX-002', type: 'out', date: '2026-11-02', materialId: 'MTR-001', price: 55000, placeId: 'PLC-001' },
            { id: 'TX-003', type: 'out', date: '2026-11-05', materialId: 'BSN-001', price: 35000, placeId: 'PLC-002' },
            { id: 'TX-004', type: 'out', date: '2026-11-08', materialId: 'MTR-001', price: 57000, placeId: 'PLC-001' }
          ]);

          // Navigation State
          const [currentView, setCurrentView] = useState('dashboard'); // dashboard, materials, places, add_expense, add_income, add_material, material_detail, place_detail, add_place
          const [viewParams, setViewParams] = useState({});

          // --- UTILS & HELPERS ---
          const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
          const formatDate = (dateStr) => new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(dateStr));
          
          const navigate = (view, params = {}) => {
            setCurrentView(view);
            setViewParams(params);
          };

          const getPrefix = (category) => {
            const map = { 'Motor': 'MTR', 'Bensin': 'BSN', 'Hobby': 'HBB', 'Internet': 'INT', 'Jajan': 'JJN', 'Handphone': 'HPN' };
            return map[category] || 'MAT';
          };

          const generateMaterialId = (category) => {
            const prefix = getPrefix(category);
            const existing = materials.filter(m => m.id.startsWith(prefix));
            return `${prefix}-${String(existing.length + 1).padStart(3, '0')}`;
          };

          const generatePlaceId = () => `PLC-${String(places.length + 1).padStart(3, '0')}`;
          const generateTxId = () => `TX-${String(transactions.length + 1).padStart(3, '0')}`;

          // --- DERIVED DATA ---
          const totalIn = transactions.filter(t => t.type === 'in').reduce((acc, curr) => acc + curr.amount, 0);
          const totalOut = transactions.filter(t => t.type === 'out').reduce((acc, curr) => acc + curr.price, 0);
          const balance = totalIn - totalOut;

          // --- SUB-COMPONENTS (PAGES) ---

          // 1. Dashboard
          const Dashboard = () => {
            const [periodFilter, setPeriodFilter] = useState('all');
            const [txTypeFilter, setTxTypeFilter] = useState('all');

            const parseTxDate = (dateStr) => {
              const [year, month, day] = dateStr.split('-');
              return new Date(year, month - 1, day);
            };

            const getFilteredTransactions = (txs, period) => {
              const now = new Date();
              const y = now.getFullYear();
              const m = now.getMonth();
              const d = now.getDate();
              
              const today = new Date(y, m, d);
              const dayOfWeek = today.getDay();
              const diffToMonday = d - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
              const startOfWeek = new Date(y, m, diffToMonday);
              
              return txs.filter(tx => {
                const txDate = parseTxDate(tx.date);
                
                if (period === 'today') return txDate.getTime() === today.getTime();
                if (period === 'week') return txDate >= startOfWeek;
                if (period === 'month') return txDate.getFullYear() === y && txDate.getMonth() === m;
                if (period === 'year') return txDate.getFullYear() === y;
                return true; 
              });
            };

            const periodFilteredTxs = getFilteredTransactions(transactions, periodFilter);
            let listTxs = periodFilteredTxs.filter(tx => txTypeFilter === 'all' || tx.type === txTypeFilter);
            listTxs.sort((a, b) => new Date(b.date) - new Date(a.date));

            const renderTxItem = (tx) => {
              const isOut = tx.type === 'out';
              const mat = materials.find(m => m.id === tx.materialId);
              return (
                <div key={tx.id} className="p-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                  <div className="flex items-center gap-3">
                    <div className={`p-3 rounded-2xl ${isOut ? 'bg-rose-50 text-rose-500' : 'bg-teal-50 text-teal-500'}`}>
                      {isOut ? <IconBox /> : <IconWallet />}
                    </div>
                    <div>
                      <p className="font-semibold text-slate-800 text-sm">
                        {mat ? (
                           <button onClick={() => navigate('material_detail', { id: mat.id })} className="hover:text-teal-600 hover:underline text-left cursor-pointer transition-colors">
                              {mat.desc}
                           </button>
                        ) : (tx.desc || 'Unknown')}
                      </p>
                      <p className="text-xs text-slate-400 mt-0.5">{formatDate(tx.date)} {isOut && mat ? `• ${mat.category}` : ''}</p>
                    </div>
                  </div>
                  <div className={`font-semibold ${isOut ? 'text-rose-600' : 'text-teal-600'}`}>
                    {isOut ? '-' : '+'}{formatIDR(isOut ? tx.price : tx.amount)}
                  </div>
                </div>
              );
            };

            return (
              <div className="space-y-6 pb-20 sm:pb-6 fade-in">
                <div className="bg-gradient-to-br from-teal-500 to-emerald-600 rounded-3xl p-6 text-white shadow-lg shadow-teal-200">
                  <p className="text-teal-50 text-sm font-medium mb-1">Total Saldo Saat Ini</p>
                  <h2 className="text-3xl sm:text-4xl font-bold tracking-tight mb-6">{formatIDR(balance)}</h2>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-white/20 backdrop-blur-md rounded-2xl p-4">
                      <div className="flex items-center gap-2 mb-1">
                        <div className="p-1 bg-white/20 rounded-full"><IconTrendingDown /></div>
                        <span className="text-xs font-medium uppercase tracking-wider">Pengeluaran</span>
                      </div>
                      <p className="font-semibold">{formatIDR(totalOut)}</p>
                    </div>
                    <div className="bg-white/20 backdrop-blur-md rounded-2xl p-4">
                      <div className="flex items-center gap-2 mb-1">
                        <div className="p-1 bg-white/20 rounded-full"><IconTrendingUp /></div>
                        <span className="text-xs font-medium uppercase tracking-wider">Pemasukan</span>
                      </div>
                      <p className="font-semibold">{formatIDR(totalIn)}</p>
                    </div>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button onClick={() => navigate('add_expense')} className="flex-1 bg-white border border-rose-100 hover:bg-rose-50 text-rose-600 font-semibold py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center gap-2 transition-colors">
                    <IconTrendingDown /> Catat Keluar
                  </button>
                  <button onClick={() => navigate('add_income')} className="flex-1 bg-white border border-teal-100 hover:bg-teal-50 text-teal-600 font-semibold py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center gap-2 transition-colors">
                    <IconTrendingUp /> Catat Masuk
                  </button>
                </div>

                <div className="flex items-center justify-between mt-8 mb-4 px-1">
                    <h3 className="text-lg font-bold text-slate-800">Alokasi Pengeluaran</h3>
                    <select value={periodFilter} onChange={(e) => setPeriodFilter(e.target.value)} className="border border-slate-200 text-slate-600 rounded-xl px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 font-medium cursor-pointer">
                        <option value="today">Hari Ini</option>
                        <option value="week">Minggu Ini</option>
                        <option value="month">Bulan Ini</option>
                        <option value="year">Tahun Ini</option>
                        <option value="all">Semua Waktu</option>
                    </select>
                </div>

                <ExpensePieChart transactions={periodFilteredTxs} materials={materials} formatIDR={formatIDR} />

                <div className="mt-6">
                  <div className="flex items-center justify-between mb-3 px-1">
                     <h3 className="text-lg font-bold text-slate-800">Transaksi Terakhir</h3>
                     <select value={txTypeFilter} onChange={e => setTxTypeFilter(e.target.value)} className="border border-slate-200 text-slate-600 rounded-xl px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 font-medium cursor-pointer">
                        <option value="all">Semua Jenis</option>
                        <option value="in">Pemasukan</option>
                        <option value="out">Pengeluaran</option>
                     </select>
                  </div>
                  
                  {listTxs.length === 0 ? (
                     <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 text-center text-slate-500 text-sm">Belum ada transaksi pada filter ini</div>
                  ) : periodFilter === 'year' ? (

                              if(!acc[mName]) acc[mName] = [];
                              acc[mName].push(tx);

                           }, {})

                           <div key={mName} className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">

          // 2. Material Master List
          const MaterialList = () => {
            const [searchTerm, setSearchTerm] = useState('');
            const filteredMaterials = materials.filter(m => {
               const term = searchTerm.toLowerCase();
               return m.desc.toLowerCase().includes(term) || m.id.toLowerCase().includes(term) || (m.brand && m.brand.toLowerCase().includes(term));

                </div>

                  {filteredMaterials.map(mat => {
                    const isIncome = mat.flowType === 'in' || mat.category === 'Income';
                    return (
                    <div key={mat.id} onClick={() => navigate('material_detail', { id: mat.id })} className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-all hover:border-teal-200">

                        <span className={`text-xs font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider ${isIncome ? 'text-emerald-700 bg-emerald-50' : 'text-teal-700 bg-teal-50'}`}>{mat.id}</span>
                        <div className="flex gap-1.5">
                           <span className={`text-[10px] font-bold px-2 py-1 rounded-md uppercase ${isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                              {isIncome ? 'Masuk' : 'Keluar'}
                           </span>
                           <span className="text-[10px] text-slate-500 bg-slate-100 px-2 py-1 rounded-md font-medium">{mat.category}</span>
                        </div>
                      </div>
                      <h3 className="font-bold text-slate-800 text-lg mb-1">{mat.desc}</h3>
                      <p className="text-sm text-slate-500">
                         {isIncome ? `Sumber: ${mat.source || '-'}` : `${mat.brand || '-'} • ${mat.partNum || '-'}`}
                      </p>
                    </div>
                  )})}
                </div>
              </div>
            );
          };

          // 3. Material Detail
          const MaterialDetail = () => {
            const mat = materials.find(m => m.id === viewParams.id);
            if (!mat) return <div>Material not found</div>;

            const relatedTx = transactions.filter(t => t.type === 'out' && t.materialId === mat.id).sort((a,b) => new Date(a.date) - new Date(b.date));
            
            // Group transactions by date for better charting
            const groupedTx = relatedTx.reduce((acc, tx) => {
                const date = tx.date;
                if (!acc[date]) acc[date] = { date, count: 0, price: tx.pricePerUnit || tx.price };
                acc[date].count += (tx.qty || 1);
                return acc;
            }, {});
            const chartData = Object.values(groupedTx).sort((a,b) => new Date(a.date) - new Date(b.date));
            
            const priceData = chartData.map(d => ({ value: d.price, label: formatDate(d.date) }));
            const freqData = chartData.map(d => ({ value: d.count, label: formatDate(d.date) }));

            const isIncome = mat.flowType === 'in' || mat.category === 'Income';

            return (
              <div className="space-y-6 pb-20 sm:pb-6 fade-in">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <button onClick={() => navigate('materials')} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>
                    <h2 className="text-xl font-bold text-slate-800">Detail Material</h2>
                  </div>
                  <button onClick={() => navigate('add_material', { editId: mat.id })} className="p-2 bg-white rounded-xl shadow-sm text-teal-600 hover:bg-teal-50 border border-teal-100 flex items-center gap-2 text-sm font-medium transition-colors">
                    <IconEdit /> <span className="hidden sm:inline">Edit Material</span>
                  </button>
                </div>

                <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <div className="flex gap-2 items-center mb-2">
                         <div className={`text-xs font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider inline-block ${isIncome ? 'text-emerald-700 bg-emerald-50' : 'text-teal-700 bg-teal-50'}`}>{mat.id}</div>
                         <div className={`text-[10px] font-bold px-2 py-1 rounded-md uppercase ${isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>{isIncome ? 'Pemasukan' : 'Pengeluaran'}</div>
                      </div>
                      <h2 className="text-2xl font-bold text-slate-800">{mat.desc}</h2>
                    </div>
                    <div className="text-right">
                      <span className="block text-xs text-slate-400">Kategori</span>
                      <span className="font-semibold text-slate-700">{mat.category}</span>
                    </div>
                  </div>
                  {isIncome ? (
                    <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-50">
                      <div>
                        <span className="block text-xs text-slate-400 mb-1">Sumber</span>
                        <span className="font-medium text-slate-700 text-sm">{mat.source || '-'}</span>
                      </div>
                      <div>
                        <span className="block text-xs text-slate-400 mb-1">Default Harga</span>
                        <span className="font-medium text-slate-700 text-sm">{mat.amount ? formatIDR(mat.amount) : '-'}</span>
                      </div>
                    </div>
                  ) : (
                    <div className="grid grid-cols-3 gap-4 pt-4 border-t border-slate-50">
                      <div>
                        <span className="block text-xs text-slate-400 mb-1">Brand</span>
                        <span className="font-medium text-slate-700 text-sm">{mat.brand || '-'}</span>
                      </div>
                      <div>
                        <span className="block text-xs text-slate-400 mb-1">Part Number</span>
                        <span className="font-medium text-slate-700 text-sm">{mat.partNum || '-'}</span>
                      </div>
                      <div>
                        <span className="block text-xs text-slate-400 mb-1">Satuan</span>
                        <span className="font-medium text-slate-700 text-sm">{mat.unit || '-'}</span>
                      </div>
                    </div>
                  )}

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-2">Tren Harga Pembelian</h3>
                    <SimpleLineChart data={priceData} color="#0ea5e9" />
                  </div>
                  <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
                    <h3 className="text-sm font-bold text-slate-700 mb-2">Frekuensi Beli</h3>
                    <SimpleBarChart data={freqData} color="#14b8a6" unit={mat.unit} />
                  </div>
                </div>

                <PhotoGallery photos={mat.photos} />

                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">

                    <table className="w-full text-sm text-left">

                        <tr>

                          <th className="px-5 py-3 font-medium">Qty</th>
                          <th className="px-5 py-3 font-medium">Harga/Unit</th>

                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-50">
                        {relatedTx.length === 0 && (

                            <tr key={tx.id} className="hover:bg-slate-50/50">
                              <td className="px-5 py-3 text-slate-600 whitespace-nowrap">{formatDate(tx.date)}</td>
                              <td className="px-5 py-3 text-slate-600 whitespace-nowrap">{tx.qty || 1} {mat.unit}</td>
                              <td className="px-5 py-3 text-slate-600 whitespace-nowrap">{formatIDR(tx.pricePerUnit || tx.price)}</td>
                              <td className="px-5 py-3 font-bold text-rose-600 whitespace-nowrap">{formatIDR(tx.price)}</td>
                              <td className="px-5 py-3 whitespace-nowrap">
                                <button onClick={() => navigate('place_detail', { id: tx.placeId })} className="text-teal-600 hover:text-teal-700 font-medium hover:underline inline-flex items-center gap-1">
                                  <IconMapPin /> {place?.name || 'Unknown'}
                                </button>
                              </td>
                            </tr>
                          )
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            );
          };

          // 3.5 Place List (Vendor Master)
          const PlaceList = () => {
            return (
              <div className="space-y-4 pb-20 sm:pb-6 fade-in">
                <div className="flex items-center justify-between">
                  <h2 className="text-2xl font-bold text-slate-800">Master Vendor / Toko</h2>
                  <button onClick={() => navigate('add_place')} className="bg-teal-600 hover:bg-teal-700 text-white p-2 rounded-xl shadow-sm transition-colors">
                    <IconPlus />
                  </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {places.map(place => (
                    <div key={place.id} onClick={() => navigate('place_detail', { id: place.id })} className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-all hover:border-teal-200">
                      <div className="flex justify-between items-start mb-2">
                        <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg uppercase tracking-wider">{place.id}</span>
                      </div>
                      <h3 className="font-bold text-slate-800 text-lg mb-1">{place.name}</h3>
                      <p className="text-sm text-slate-500 line-clamp-1">{place.address}</p>
                    </div>
                  ))}
                </div>
              </div>
            );
          };

          // 4. Place Detail
          const PlaceDetail = () => {
            const place = places.find(p => p.id === viewParams.id);
            if (!place) return <div>Place not found</div>;
            const relatedTx = transactions.filter(t => t.type === 'out' && t.placeId === place.id).sort((a,b) => new Date(b.date) - new Date(a.date));

            return (
              <div className="space-y-6 pb-20 sm:pb-6 fade-in">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <button onClick={() => navigate('places')} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>
                    <h2 className="text-xl font-bold text-slate-800">Detail Tempat Beli</h2>
                  </div>
                  <button onClick={() => navigate('add_place', { editId: place.id })} className="p-2 bg-white rounded-xl shadow-sm text-indigo-600 hover:bg-indigo-50 border border-indigo-100 flex items-center gap-2 text-sm font-medium transition-colors">
                    <IconEdit /> <span className="hidden sm:inline">Edit Toko</span>
                  </button>
                </div>

                <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100">
                  <div className="p-6">
                     <div className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg uppercase tracking-wider inline-block mb-2">{place.id}</div>
                     <h2 className="text-2xl font-bold text-slate-800 mb-2">{place.name}</h2>
                     <p className="text-slate-500 text-sm mb-4 flex items-start gap-2">
                        <span className="mt-0.5 text-slate-400"><IconMapPin /></span> {place.address}
                     </p>
                     <a href={place.mapLink} target="_blank" rel="noreferrer" className="inline-flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-medium px-4 py-2 rounded-xl transition-colors text-sm">
                        Buka di Google Maps
                     </a>
                  </div>
                </div>

                <PhotoGallery photos={place.photos} />

                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                  <div className="p-5 border-b border-slate-50">
                    <h3 className="font-bold text-slate-800">Riwayat Transaksi di {place.name}</h3>
                  </div>
                  <div className="divide-y divide-slate-50">
                    {relatedTx.length === 0 && <div className="p-5 text-center text-slate-400">Belum ada riwayat</div>}
                    {relatedTx.map(tx => {
                       const mat = materials.find(m => m.id === tx.materialId);
                       return (
                         <div key={tx.id} className="p-4 flex justify-between items-start hover:bg-slate-50">
                            <div>
                              <div className="flex items-center gap-2 mb-1">
                                  <button onClick={() => mat && navigate('material_detail', { id: mat.id })} className="text-[10px] font-bold px-2 py-0.5 rounded-md uppercase bg-teal-50 text-teal-700 hover:bg-teal-100 transition-colors cursor-pointer text-left">
                                     {mat?.id}
                                  </button>
                                  <button onClick={() => mat && navigate('material_detail', { id: mat.id })} className="font-semibold text-slate-800 text-sm hover:text-teal-600 hover:underline cursor-pointer text-left transition-colors">
                                     {mat?.desc}

                               <span className="font-bold text-rose-600 block">{formatIDR(tx.price)}</span>
                               <span className="text-[10px] text-slate-400">{formatIDR(tx.pricePerUnit || tx.price)} / {mat?.unit || 'Pcs'}</span>
                            </div>
                         </div>
                       )
                    })}
                  </div>
                </div>
              </div>
            );

          // 5. Add Expense Form (Catat Keluar)
          const AddExpense = () => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            
            // Material Autocomplete States
            const [materialId, setMaterialId] = useState('');
            const [matSearch, setMatSearch] = useState('');
            const [descSearch, setDescSearch] = useState('');
            const [showMatDropdown, setShowMatDropdown] = useState(false);
            const [showDescDropdown, setShowDescDropdown] = useState(false);

            const [qty, setQty] = useState(1);
            const [pricePerUnit, setPricePerUnit] = useState('');
            
            // Vendor Autocomplete States
            const [placeId, setPlaceId] = useState('');
            const [placeSearch, setPlaceSearch] = useState('');
            const [showPlaceDropdown, setShowPlaceDropdown] = useState(false);
            
            const totalPrice = (parseFloat(qty) || 0) * (parseInt(pricePerUnit) || 0);

            useEffect(() => {
              if (viewParams.prefilledMaterial) {
                const m = materials.find(x => x.id === viewParams.prefilledMaterial);
                if (m) selectMaterial(m);
              }
              if (viewParams.prefilledPlace) {
                setPlaceId(viewParams.prefilledPlace);
                const p = places.find(x => x.id === viewParams.prefilledPlace);
                if (p) setPlaceSearch(p.name);
              }
            }, [viewParams, materials, places]);

            const selectMaterial = (m) => {
              setMaterialId(m.id);
              setMatSearch(m.id);
              setDescSearch(`${m.desc} - ${m.partNum}`);
              setShowMatDropdown(false);
              setShowDescDropdown(false);
            };

            const selectPlace = (p) => {
              setPlaceId(p.id);
              setPlaceSearch(p.name);
              setShowPlaceDropdown(false);
            };

            const handleBlur = (setter) => {
              setTimeout(() => setter(false), 200);
            };

            const handleSave = (e) => {
              e.preventDefault();
              if (!materialId || !totalPrice || !placeId) return;
              const newTx = {
                id: generateTxId(),
                type: 'out',
                date,
                materialId,
                qty: parseFloat(qty),
                pricePerUnit: parseInt(pricePerUnit),
                price: totalPrice,
                placeId
              };
              setTransactions([...transactions, newTx]);
              navigate('dashboard');
            };

            const outMaterials = materials.filter(m => m.flowType === 'out' || m.flowType === undefined);
            const filteredByMat = outMaterials.filter(m => m.id.toLowerCase().includes(matSearch.toLowerCase()));
            const filteredByDesc = outMaterials.filter(m => {
              const searchStr = descSearch.toLowerCase();
              const combined = `${m.desc} - ${m.partNum || ''}`.toLowerCase();
              return combined.includes(searchStr);
            });

            const filteredPlaces = places.filter(p => p.name.toLowerCase().includes(placeSearch.toLowerCase()));

            return (
              <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">
                <div className="flex items-center gap-3">
                  <button onClick={() => navigate('dashboard')} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>
                  <h2 className="text-xl font-bold text-slate-800">Catat Pengeluaran</h2>
                </div>

                <form onSubmit={handleSave} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-5">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all bg-slate-50" />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                       <label className="block text-sm font-medium text-slate-700">Pilih Material / Barang</label>
                       <button type="button" onClick={() => navigate('add_material', { returnTo: 'add_expense' })} className="text-xs text-teal-600 font-semibold hover:underline">
                         + Buat Baru
                       </button>
                    </div>
                    
                    <div className="space-y-3 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                      <div className="relative">
                        <input 
                           type="text" 
                           value={matSearch} 
                           onChange={e => {
                             setMatSearch(e.target.value); 
                             setMaterialId('');
                             setShowMatDropdown(true);
                           }}
                           onFocus={() => setShowMatDropdown(true)}
                           onBlur={() => handleBlur(setShowMatDropdown)}
                           className="w-full border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all bg-white text-sm"
                           placeholder="Ketik ID Material Master..."
                           required={!materialId}
                        />
                        {showMatDropdown && (
                          <div className="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto">
                            {filteredByMat.length > 0 ? filteredByMat.map(m => (
                              <div key={m.id} onClick={() => selectMaterial(m)} className="px-4 py-2 hover:bg-teal-50 cursor-pointer text-sm border-b border-slate-50 last:border-0">
                                <span className="font-bold text-teal-700">{m.id}</span>
                              </div>
                            )) : <div className="px-4 py-2 text-sm text-slate-400">Tidak ditemukan</div>}
                          </div>
                        )}
                      </div>

                      <div className="relative">
                        <input 
                           type="text" 
                           value={descSearch} 
                           onChange={e => {
                             setDescSearch(e.target.value); 
                             setMaterialId('');
                             setShowDescDropdown(true);
                           }}
                           onFocus={() => setShowDescDropdown(true)}
                           onBlur={() => handleBlur(setShowDescDropdown)}
                           className="w-full border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all bg-white text-sm"
                           placeholder="Atau ketik Nama Barang - Part Number..."
                           required={!materialId}
                        />

                          <div className="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-40 overflow-y-auto">
                            {filteredByDesc.length > 0 ? filteredByDesc.map(m => (
                              <div key={m.id} onClick={() => selectMaterial(m)} className="px-4 py-2 hover:bg-teal-50 cursor-pointer text-sm border-b border-slate-50 last:border-0">
                                {m.desc} - {m.partNum} <span className="text-xs text-slate-400">({m.id})</span>
                              </div>
                            )) : <div className="px-4 py-2 text-sm text-slate-400">Tidak ditemukan</div>}
                          </div>
                        )}

                    {!materialId && (matSearch || descSearch) && (
                       <p className="text-xs text-rose-500 mt-1">*Pilih material dari rekomendasi dropdown yang muncul</p>

                  <div className="grid grid-cols-2 gap-4">
                     <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Qty</label>

                     </div>
                     <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Harga Satuan</label>

          // 6. Add/Edit Material Master
          const AddMaterial = () => {

            const [unit, setUnit] = useState(existing?.unit || 'Pcs');
            const [category, setCategory] = useState(existing?.category || 'Motor');

            const [amount, setAmount] = useState(existing?.amount || '');
            const [source, setSource] = useState(existing?.source || '');
            
            const [photos, setPhotos] = useState(existing?.photos || []);

            const handleSave = (e) => {
              e.preventDefault();
              
              const matData = {
                flowType, desc, 
                partNum: flowType === 'out' ? partNum : '', 
                brand: flowType === 'out' ? brand : '', 
                unit: flowType === 'out' ? unit : '', 
                category: flowType === 'out' ? category : 'Income',
                amount: flowType === 'in' ? parseInt(amount) : undefined,
                source: flowType === 'in' ? source : undefined,
                photos: flowType === 'out' ? photos : []
              };

              if (isEdit) {
                setMaterials(materials.map(m => m.id === existing.id ? { ...m, ...matData } : m));
                navigate('material_detail', { id: existing.id });
              } else {
                const newId = generateMaterialId(flowType === 'in' ? 'Income' : category);
                const newMat = { id: newId, ...matData };
                setMaterials([...materials, newMat]);
                
                if (viewParams.returnTo) {
                  navigate(viewParams.returnTo, { prefilledMaterial: newId });
                } else {
                  navigate('materials');

            return (
              <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">

                       <button type="button" onClick={() => setFlowType('in')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${flowType === 'in' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:bg-slate-200/50'}`}>Pemasukan</button>

           const AddPlace = () => {
            const isEdit = !!viewParams.editId;

                 if (viewParams.returnTo) {
                   navigate(viewParams.returnTo, { prefilledPlace: newId });

                   navigate('dashboard');

            };

            return (
              <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">

                  <button onClick={() => navigate(isEdit ? 'place_detail' : (viewParams.returnTo || 'dashboard'), { id: isEdit ? existing.id : undefined })} className="p-2 bg-white rounded-xl shadow-sm text-slate-500 hover:text-slate-800"><IconChevronLeft /></button>

                </div>

                <form onSubmit={handleSave} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">

                    <input type="text" value={name} onChange={e => setName(e.target.value)} required className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all bg-slate-50" placeholder="Cth: Indomaret, Bengkel A" />

                    <label className="block text-sm font-medium text-slate-700 mb-1">Alamat Lengkap</label>
                    <textarea value={address} onChange={e => setAddress(e.target.value)} rows="3" className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all bg-slate-50" placeholder="Alamat lengkap toko"></textarea>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Link Google Maps (Opsional)</label>
                    <input type="url" value={mapLink} onChange={e => setMapLink(e.target.value)} className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all bg-slate-50" placeholder="https://maps.app.goo.gl/..." />

                          <span className="text-[10px] font-medium mt-1">Upload</span>

                    Simpan Tempat
                  </button>
                </form>
              </div>

           // 8. Add Income Form
           const AddIncome = () => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            
            // Material Autocomplete States for Income
            const [materialId, setMaterialId] = useState('');
            const [matSearch, setMatSearch] = useState('');
            const [descSearch, setDescSearch] = useState('');
            const [showMatDropdown, setShowMatDropdown] = useState(false);
            const [showDescDropdown, setShowDescDropdown] = useState(false);
            
            const [amount, setAmount] = useState('');

            const selectMaterial = (m) => {
              setMaterialId(m.id);
              setMatSearch(m.id);
              setDescSearch(`${m.desc} - ${m.source}`);
              if (m.amount) setAmount(m.amount);
              setShowMatDropdown(false);
              setShowDescDropdown(false);
            };

            const handleBlur = (setter) => {
              setTimeout(() => setter(false), 200);
            };

            const handleSave = (e) => {
              e.preventDefault();
              if (!materialId || !amount) return;
              const newTx = {
                id: generateTxId(),
                type: 'in',
                date,
                materialId,
                amount: parseInt(amount),
              };
              setTransactions([...transactions, newTx]);
              navigate('dashboard');
            };

            const inMaterials = materials.filter(m => m.flowType === 'in' || m.category === 'Income');
            const filteredByMat = inMaterials.filter(m => m.id.toLowerCase().includes(matSearch.toLowerCase()));
            const filteredByDesc = inMaterials.filter(m => {
              const searchStr = descSearch.toLowerCase();
              const combined = `${m.desc} - ${m.source || ''}`.toLowerCase();
              return combined.includes(searchStr);
            });

            return (
              <div className="max-w-md mx-auto space-y-6 pb-20 sm:pb-6 fade-in">

                           value={descSearch} 
                           onChange={e => {
                             setDescSearch(e.target.value); 
                             setMaterialId('');
                             setShowDescDropdown(true);
                           }}
                           onFocus={() => setShowDescDropdown(true)}
                           onBlur={() => handleBlur(setShowDescDropdown)}
                           className="w-full border border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all bg-white text-sm"

                <button onClick={() => navigate('materials')} className={`flex flex-col items-center gap-1 ${['materials', 'material_detail'].includes(currentView) ? 'text-teal-600' : 'text-slate-400'}`}>
                   <IconBox />
                   <span className="text-[10px] font-medium">Materials</span>
                </button>
                <button onClick={() => navigate('places')} className={`flex flex-col items-center gap-1 ${['places', 'place_detail'].includes(currentView) ? 'text-teal-600' : 'text-slate-400'}`}>
                   <IconMapPin />
                   <span className="text-[10px] font-medium">Vendors</span>
                </button>
              </nav>

            </div>
          );
        }

        // --- RENDER KE DOM HTML ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CashFlowApp />);
    </script>
</body>
